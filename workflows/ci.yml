name: CashFlowApp CI-Pipeline

on: [push, pull_request]

jobs:
    test:
        runs-on: ubuntu-latest
        steps: 
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '20'
                cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Type Check
              run: npm run type-check

            - name: Lint
              run: npm run lint     # Runs code quality checks by running static analysis tools

            - name: Test
              run: npm test

            - name: Build
              run: npm run build